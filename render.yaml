services:
  - type: web
    name: namman-erp
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm ci
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    envVars:
      # App
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TZ
        value: Asia/Kolkata
      - key: DB_DIALECT
        value: postgres

      # Database (auto-filled from database below)
      - key: DATABASE_URL
        fromDatabase:
          name: namman-db
          property: connectionString

      # Auth
      - key: JWT_SECRET
        generateValue: true

      # Company Branding
      - key: COMPANY_NAME
        value: "Namman Dental Hospital pvt ltd"
      - key: COMPANY_SHORT_NAME
        value: ERP
      - key: COMPANY_TAGLINE
        value: "Business Management Platform"
      - key: COMPANY_ADDRESS
        value: "Namman Dental Hospital, V-26, Geetanjali Colony, Shankar Nagar, Raipur, Chhattisgarh 492007"
      - key: COMPANY_CITY
        value: Raipur
      - key: COMPANY_STATE
        value: Chhattisgarh
      - key: COMPANY_PINCODE
        value: "492007"
      - key: COMPANY_PHONE
        value: "+91-7000277736"
      - key: COMPANY_EMAIL
        value: info@nammandental.com
      - key: COMPANY_WEBSITE
        value: https://nammandental.com
      - key: COMPANY_WHATSAPP
        value: "+91-7000277736"
      - key: COMPANY_LOGO_URL
        value: https://nammandental.com/logo.png

      # Frontend URLs (UPDATE AFTER VERCEL DEPLOY)
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app
      - key: FRONTEND_LOGIN_URL
        value: https://your-frontend.vercel.app/auth/login

      # Email / SMTP
      - key: SMTP_HOST
        value: nammanhospital@gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: nammanhospital@gmail.com
      - key: SMTP_PASS
        value: namman@2015
      - key: DEFAULT_FROM_EMAIL
        value: nammanhospital@gmail.com

      # Certificate Signatory
      - key: CERT_SIGNATORY_NAME
        value: "DR. Manoj Agrawal"
      - key: CERT_SIGNATORY_ROLE
        value: "DR. MANOJ AGRAWAL (MDS, Oral & Maxillofacial Surgery)"

      # Puppeteer - Render has chromium
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"

databases:
  - name: namman-db
    databaseName: erp_namman
    user: erp_user
    plan: free
    region: singapore